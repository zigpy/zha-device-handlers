[build-system]
requires = ["setuptools>=61.0.0", "wheel", "setuptools-git-versioning<2"]
build-backend = "setuptools.build_meta"

[project]
name = "zha-quirks"
dynamic = ["version"]
description = "Library implementing Zigpy quirks for ZHA in Home Assistant"
urls = { repository = "https://github.com/zigpy/zha-device-handlers" }
authors = [{ name = "David F. Mulcahey", email = "david.mulcahey@icloud.com" }]
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = ["zigpy>=2.4.0", "zha>=2.4.0"]

[tool.setuptools.packages.find]
exclude = ["tests", "tests.*", "tools", "tools.*"]

[dependency-groups]
ci = [
    "pytest-github-actions-annotate-failures>=0.3.0",
    "pytest-xdist>=3.8.0",
]
dev = [
    "codecov",
    "codespell>=2.3.0",
    "colorlog",
    "coveralls",
    "mypy==2.4.1",   # The pre-commit hook runs this pinned version
    "pre-commit",
    "pylint",
    "pytest>=7.1.3",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-sugar",
    "pytest-timeout",
    "ruff==0.15.17",        # Keep this in sync with .pre-commit-config.yaml
    "time-machine>=2,<3",
]

[tool.setuptools-git-versioning]
enabled = true

[tool.pylint]
max-line-length = 120
disable = ["C0103", "W0212"]

[tool.mypy]
python_version = "3.12"
strict = true
follow_imports = "silent"
ignore_missing_imports = true
warn_incomplete_stub = true
warn_unreachable = true
show_error_codes = true
show_error_context = true
error_summary = true
exclude = ["^tests/"]

install_types = true
non_interactive = true

# Floor for every module: the error codes the old global `disable_error_code`
# list turned off. mypy adds a parent pattern's disabled codes to every more
# specific entry, so no module is checked more strictly for these codes than
# before, and a new quirk passes wherever it is added. Everything else `strict`
# enables is enforced. `arg-type` and `assignment` can only go once zigpy's
# cluster-definition typing is fixed (zigpy/zigpy#1827); tightening the rest is a
# separate decision.
[[tool.mypy.overrides]]
module = "zhaquirks.*"
disable_error_code = [
    "arg-type",
    "assignment",
    "attr-defined",
    "call-arg",
    "dict-item",
    "index",
    "misc",
    "no-any-return",
    "no-untyped-call",
    "no-untyped-def",
    "override",
    "return-value",
    "union-attr",
    "var-annotated",
]

